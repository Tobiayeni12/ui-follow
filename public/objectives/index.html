<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Current Objectives Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/objectives/objectives.css" />
</head>
<body>
  <div id="stage">
    <canvas id="fx"></canvas>

    <div class="panel">
      <div class="current-box pixel-box">
        <div class="current-label">Current Objective</div>
        <div class="current-text" id="currentText"></div>
      </div>

      <div class="list" id="list"></div>

      <div class="empty-box pixel-box" id="emptyBox">No objectives yet</div>
    </div>
  </div>

  <script>
    window.__INITIAL_STATE__ = "__INITIAL_STATE_JSON__";
  </script>
  <script type="module" src="/objectives/objectives.js"></script>
</body>
</html>
