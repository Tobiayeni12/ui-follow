<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Gift Dares Ticker Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/giftdares/giftdares.css" />
</head>
<body>
  <div id="stage">
    <div class="ticker-wrap">
      <div class="ticker-track">
        <!-- Set A -->
        <div class="card cyan">
          <img class="gift-img" src="/giftdares/gifts/gem-gun.png" alt="Gem Gun — 500" />
          <span class="arrow">➜</span>
          <span class="dare">Stop talking for 30 seconds</span>
        </div>
        <div class="card pink">
          <img class="gift-img" src="/giftdares/gifts/tiktok-universe.png" alt="TikTok Universe — 44999" />
          <span class="arrow">➜</span>
          <span class="dare">Play a game of your choosing, start to finish</span>
        </div>
        <div class="card cyan">
          <img class="gift-img" src="/giftdares/gifts/leon-the-kitten.png" alt="Leon the Kitten — 4888" />
          <span class="arrow">➜</span>
          <span class="dare">Restart the game</span>
        </div>
        <div class="card pink">
          <img class="gift-img" src="/giftdares/gifts/meteor-shower.png" alt="Meteor Shower — 3000" />
          <span class="arrow">➜</span>
          <span class="dare">New horror game</span>
        </div>
        <div class="card cyan">
          <img class="gift-img" src="/giftdares/gifts/galaxy.png" alt="Galaxy — 1000" />
          <span class="arrow">➜</span>
          <span class="dare">Stop moving</span>
        </div>

        <!-- Set B (exact duplicate) — enables the seamless -50% loop -->
        <div class="card cyan">
          <img class="gift-img" src="/giftdares/gifts/gem-gun.png" alt="Gem Gun — 500" />
          <span class="arrow">➜</span>
          <span class="dare">Stop talking for 30 seconds</span>
        </div>
        <div class="card pink">
          <img class="gift-img" src="/giftdares/gifts/tiktok-universe.png" alt="TikTok Universe — 44999" />
          <span class="arrow">➜</span>
          <span class="dare">Play a game of your choosing, start to finish</span>
        </div>
        <div class="card cyan">
          <img class="gift-img" src="/giftdares/gifts/leon-the-kitten.png" alt="Leon the Kitten — 4888" />
          <span class="arrow">➜</span>
          <span class="dare">Restart the game</span>
        </div>
        <div class="card pink">
          <img class="gift-img" src="/giftdares/gifts/meteor-shower.png" alt="Meteor Shower — 3000" />
          <span class="arrow">➜</span>
          <span class="dare">New horror game</span>
        </div>
        <div class="card cyan">
          <img class="gift-img" src="/giftdares/gifts/galaxy.png" alt="Galaxy — 1000" />
          <span class="arrow">➜</span>
          <span class="dare">Stop moving</span>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
