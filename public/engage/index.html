<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Engagement Prompts Overlay</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="stylesheet" href="/engage/engage.css" />
</head>
<body>
  <div id="stage">
    <div class="prompt prompt-tap">
      <div class="icon-wrap">
        <span class="ripple"></span>
        <span class="ripple ripple-delay"></span>
        <span class="icon">👆</span>
      </div>
      <div class="text">Are you tapping<br />the screen?</div>
    </div>

    <div class="prompt prompt-heart">
      <div class="icon-wrap">
        <span class="float-heart fh1">💗</span>
        <span class="float-heart fh2">💗</span>
        <span class="float-heart fh3">💗</span>
        <span class="icon icon-heart">💗</span>
      </div>
      <div class="text">Drop a heart!</div>
    </div>

    <div class="prompt prompt-follow">
      <div class="icon-wrap">
        <span class="pulse-ring"></span>
        <span class="follow-badge"></span>
        <span class="icon icon-follow">➕</span>
      </div>
      <div class="text">Follow while<br />you're here</div>
    </div>
  </div>
</body>
</html>
